<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculadora de Potencia Óptima</title>
<style>
:root{--accent:#c9762a;--accent2:#f0a64a;--bg:#faf9f7;--card:#fff;--border:#e8e3db;--ink:#1a1a2e;--muted:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Georgia',serif;background:var(--bg);color:var(--ink);padding:1rem}
.label{font-size:.75rem;font-family:system-ui,sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:1rem;display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:.75rem}
.card-title{font-size:.78rem;font-weight:700;font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.9rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.item{display:flex;align-items:center;gap:.55rem;padding:.55rem .65rem;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;transition:border-color .15s,background .15s;user-select:none}
.item:hover{border-color:var(--accent);background:#fff8f3}
.item.checked{border-color:var(--accent);background:#fff3e8}
.item input{display:none}
.item-icon{font-size:1.2rem;line-height:1;flex-shrink:0}
.item-info{flex:1;min-width:0}
.item-name{font-size:.78rem;font-weight:600;font-family:system-ui,sans-serif;line-height:1.2}
.item-w{font-size:.7rem;color:var(--muted);font-family:system-ui,sans-serif}
.check{width:16px;height:16px;border:2px solid var(--border);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.item.checked .check{background:var(--accent);border-color:var(--accent)}
.item.checked .check::after{content:'✓';color:#fff;font-size:.65rem;font-family:system-ui,sans-serif;font-weight:700}
.result{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:12px;padding:1.25rem;margin-bottom:.75rem;text-align:center}
.result-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.8);font-family:system-ui,sans-serif;margin-bottom:.3rem}
.result-num{font-size:2.2rem;font-weight:700;color:#fff}
.result-sub{font-size:.78rem;color:rgba(255,255,255,.85);font-family:system-ui,sans-serif;margin-top:.2rem}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-bottom:.75rem}
.tier{background:var(--card);border:1.5px solid var(--border);border-radius:8px;padding:.5rem .3rem;text-align:center;transition:border-color .2s,background .2s}
.tier.active{border-color:var(--accent);background:#fff3e8}
.tier.recommended{border-color:var(--accent);background:var(--accent)}
.tier-kw{font-size:.82rem;font-weight:700;font-family:system-ui,sans-serif}
.tier.recommended .tier-kw{color:#fff}
.tier-label{font-size:.6rem;font-family:system-ui,sans-serif;color:var(--muted);margin-top:.15rem}
.tier.recommended .tier-label{color:rgba(255,255,255,.85)}
.info-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;font-size:.78rem;font-family:system-ui,sans-serif;color:var(--ink);line-height:1.5}
.info-box b{color:var(--accent)}
footer{text-align:center;font-size:.68rem;color:var(--muted);font-family:system-ui,sans-serif;margin-top:.5rem}
@media(max-width:420px){.grid{grid-template-columns:1fr}.tiers{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<span class="label">Calculadora de potencia óptima</span>

<div class="card">
  <div class="card-title">Marca los aparatos que tienes en casa</div>
  <div class="grid" id="appGrid"></div>
</div>

<div class="result">
  <div class="result-label">Potencia pico estimada</div>
  <div class="result-num" id="rPico">0 W</div>
  <div class="result-sub" id="rSub">Selecciona tus electrodomésticos</div>
</div>

<div class="card">
  <div class="card-title">Tramos de potencia contratada</div>
  <div class="tiers" id="tiersGrid"></div>
</div>

<div class="card">
  <div class="info-box" id="infoBox">Selecciona tus electrodomésticos para ver la recomendación.</div>
</div>

<footer>Estimación orientativa · El ICP salta si superas la potencia contratada</footer>

<script>
var appliances=[
  {name:'Inducción',w:7400,icon:'🍳'},
  {name:'Vitrocerámica',w:4000,icon:'🔥'},
  {name:'Horno eléctrico',w:2200,icon:'🫙'},
  {name:'Microondas',w:1200,icon:'📦'},
  {name:'Lavadora',w:2200,icon:'🫧'},
  {name:'Secadora',w:2500,icon:'💨'},
  {name:'Lavavajillas',w:2200,icon:'🍽️'},
  {name:'Aire acondicionado',w:2000,icon:'❄️'},
  {name:'Bomba de calor',w:3000,icon:'🌡️'},
  {name:'Calefacción eléc.',w:2000,icon:'♨️'},
  {name:'Termo eléctrico',w:2000,icon:'🚿'},
  {name:'Cargador VE',w:7400,icon:'🔌'},
  {name:'Plancha',w:2400,icon:'👔'},
  {name:'Aspirador',w:1800,icon:'🧹'},
  {name:'TV + ordenador',w:500,icon:'🖥️'},
  {name:'Frigorífico',w:150,icon:'🧊'},
];
var tiers=[2.3,3.45,4.6,5.75,6.9,8.05,9.2,10.35,11.5,13.8];
var checked={};

var grid=document.getElementById('appGrid');
appliances.forEach(function(a,i){
  var div=document.createElement('label');
  div.className='item';
  div.innerHTML='<input type="checkbox" onchange="toggle('+i+')"><span class="item-icon">'+a.icon+'</span><span class="item-info"><span class="item-name">'+a.name+'</span><span class="item-w">'+a.w.toLocaleString('es-ES')+' W</span></span><span class="check"></span>';
  div.querySelector('input').addEventListener('change',function(){toggle(i,this.checked,div);});
  div.addEventListener('click',function(e){if(e.target.tagName!=='INPUT'){var inp=div.querySelector('input');inp.checked=!inp.checked;toggle(i,inp.checked,div);}});
  grid.appendChild(div);
});

function toggle(i,val,el){
  checked[i]=val;
  // re-sync all visuals
  var items=document.querySelectorAll('.item');
  items.forEach(function(it,idx){
    if(checked[idx])it.classList.add('checked');else it.classList.remove('checked');
  });
  calc();
}

function calc(){
  var sel=appliances.filter(function(a,i){return checked[i];});
  if(!sel.length){
    document.getElementById('rPico').textContent='0 W';
    document.getElementById('rSub').textContent='Selecciona tus electrodomésticos';
    document.getElementById('infoBox').textContent='Selecciona tus electrodomésticos para ver la recomendación.';
    renderTiers(-1);return;
  }
  // Peak: sum of top consumers (simulate simultaneous use)
  // Sort by wattage desc, take realistic simultaneous peak
  var sorted=sel.slice().sort(function(a,b){return b.w-a.w;});
  // Assume max 3 high-power appliances simultaneous + always-on
  var peak=0;
  sorted.forEach(function(a,i){
    if(i<4)peak+=a.w;
    else peak+=a.w*0.1; // background probability
  });
  peak=Math.round(peak*1.1); // 10% safety margin
  var kw=peak/1000;
  var rec=-1;
  for(var t=0;t<tiers.length;t++){if(tiers[t]>=kw){rec=t;break;}}
  if(rec===-1)rec=tiers.length-1;
  document.getElementById('rPico').textContent=peak.toLocaleString('es-ES')+' W';
  document.getElementById('rSub').textContent='Con margen de seguridad del 10%';
  renderTiers(rec);
  var saving=rec>0?((tiers[rec-1]<kw)?'Ya tienes la potencia mínima recomendada.':'Podrías bajar al tramo anterior y ahorrar en el término de potencia.'):'';
  document.getElementById('infoBox').innerHTML='Te recomendamos contratar <b>'+tiers[rec]+' kW</b>. '+
    (rec>0?'Si rara vez usas todos los aparatos a la vez, considera <b>'+tiers[rec-1]+' kW</b> y ahorrar en el término fijo de tu factura.':'Con tu equipamiento necesitas la máxima potencia disponible en tarifa doméstica.');
}

function renderTiers(rec){
  var g=document.getElementById('tiersGrid');
  g.innerHTML='';
  tiers.forEach(function(t,i){
    var d=document.createElement('div');
    d.className='tier'+(i===rec?' recommended':'');
    d.innerHTML='<div class="tier-kw">'+t+' kW</div><div class="tier-label">'+(i===rec?'✓ Recomendada':'')+'</div>';
    g.appendChild(d);
  });
}
renderTiers(-1);
</script>
</body>
</html>
